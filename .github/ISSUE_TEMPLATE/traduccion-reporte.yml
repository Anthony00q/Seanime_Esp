name: Error o sugerencia de traducción
description: Reporta textos sin traducir, errores de idioma o problemas con la presentación del texto.
title: 'traducción: '
labels:
  - traduccion
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla para señalar un texto sin traducir, corregir una traducción o sugerir una mejora. **No necesitas saber cuál sería la traducción correcta.**
        Si la aplicación no funciona, usa la plantilla «Problema con Seanime Esp». No necesitas comprobar si también ocurre en Seanime original.

  - type: dropdown
    id: idioma
    attributes:
      label: Idioma seleccionado
      options:
        - Español
        - Português
        - English
        - Otro / No estoy seguro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Seanime Esp
      description: Indica la versión que aparece en Ajustes. Si no puedes verla, escribe que no la sabes.
      placeholder: "Ej.: v3.x.x"
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de reporte
      options:
        - Texto sin traducir / Clave de traducción visible
        - Traducción incorrecta / Error de ortografía o gramática
        - Sugerencia de una expresión más natural
        - Texto recortado / Desbordamiento
        - Caracteres extraños / Formato de fechas, números o plurales
        - Otro / No estoy seguro
    validations:
      required: true

  - type: dropdown
    id: seccion
    attributes:
      label: Sección afectada
      options:
        - Inicio (Home)
        - Horario (Schedule)
        - Fechas / Calendarios
        - Descubrir (Discover)
        - Listas de Anime (AniList)
        - Página de un Anime/Manga
        - Colección de Manga
        - Reproductor de Video
        - Nakama (Watch Parties)
        - Descargador Automático (Auto Downloader)
        - Torrent y Streaming (Lista de torrents)
        - Extensiones
        - Paleta de Comandos (Sea Command)
        - Ajustes (Settings)
        - Bienvenida y Login
        - Avisos emergentes (Toasts / Notificaciones)
        - Menú de la bandeja / Avisos de Denshi / Pantalla de inicio (splash)
        - Otro / No estoy seguro
    validations:
      required: true

  - type: textarea
    id: texto-actual
    attributes:
      label: Texto actual o problema observado
      description: Copia el texto o la clave tal como aparece. Si falta texto o no se puede copiar, describe lo que ves.
      placeholder: 'Ej: "Habilitar la reproducción automática"'
    validations:
      required: true

  - type: textarea
    id: propuesta
    attributes:
      label: Traducción propuesta (opcional)
      description: Si tienes una alternativa, escríbela aquí. Puedes dejarlo vacío si solo quieres señalar el problema.
      placeholder: 'Ej: "Activar reproducción automática"'
    validations:
      required: false

  - type: textarea
    id: razon
    attributes:
      label: Dónde aparece y contexto (opcional)
      description: Indica cómo llegar a esa pantalla, si usas Denshi o navegador y por qué cambiarías el texto, si corresponde.

  - type: textarea
    id: captura
    attributes:
      label: Captura de pantalla (opcional)
      description: Si ayuda a entender el problema, adjunta una captura. Oculta contraseñas, tokens, claves de API y datos personales antes de publicarla.
